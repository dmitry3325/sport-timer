<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sport Timer" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="timer.webmanifest" />
  <!-- iOS home screen icon -->
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>Circle Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Use dvh so it fills the screen correctly on mobile (avoids browser chrome overlap) */
      height: 100dvh;
      height: 100vh; /* fallback */
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    .timer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      padding: env(safe-area-inset-top, 50px) 0 calc(env(safe-area-inset-bottom, 0px) + 50px);
    }

    .spacer { flex: 1; }

    /* ── Top stats bar ── */
    .stats-bar {
      width: 100%;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .stat-round {
      font-size: 15px;
      font-weight: 600;
      color: #ff9f0a;
      letter-spacing: 0.3px;
    }

    .stat-round span {
      font-weight: 300;
      color: #636366;
    }

    .stat-time {
      font-size: 15px;
      font-weight: 300;
      color: #636366;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    /* ── Circle ── */
    .circle-container {
      position: relative;
      width: min(320px, 80vw);
      height: min(320px, 80vw);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    svg.ring {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: #1c1c1e;
      stroke-width: 16;
    }

    .ring-progress {
      fill: none;
      stroke: #ff9f0a;
      stroke-width: 16;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
    }

    .ring-progress.warning { stroke: #40c8e0; }

    /* ── Center text ── */
    .center-display {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .time-text {
      font-size: clamp(56px, 18vw, 80px);
      font-weight: 200;
      color: #fff;
      letter-spacing: -4px;
      line-height: 1;
      transition: color 0.4s ease;
    }

    .time-text.warning { color: #40c8e0; }

    .time-label {
      font-size: 13px;
      font-weight: 400;
      color: #636366;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      padding: 0 40px;
    }

    .duration-picker {
      display: flex;
      gap: 12px;
    }

    .duration-btn {
      width: 76px;
      height: 40px;
      border-radius: 20px;
      border: 2px solid #3a3a3c;
      background: transparent;
      color: #8e8e93;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .duration-btn.active {
      border-color: #ff9f0a;
      background: rgba(255, 159, 10, 0.15);
      color: #ff9f0a;
    }

    .action-row {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn-reset {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #1c1c1e;
      color: #aeaeb2;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    /* SVG icon inside reset button */
    .btn-reset svg { width: 24px; height: 24px; }
    .btn-reset:active { transform: scale(0.93); background: #2c2c2e; }

    .btn-start {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #ff9f0a;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 24px rgba(255, 159, 10, 0.35);
    }

    /* SVG icons inside start button */
    .btn-start svg { width: 28px; height: 28px; }
    .btn-start .icon-play  { display: block; }
    .btn-start .icon-pause { display: none; }

    .btn-start.running .icon-play  { display: none; }
    .btn-start.running .icon-pause { display: block; }

    .btn-start:active { transform: scale(0.93); }
    .btn-start.running {
      background: #1c1c1e;
      color: #aeaeb2;
      box-shadow: none;
    }

    /* ── Pulse ring ── */
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(255, 159, 10, 0.45); }
      70%  { box-shadow: 0 0 0 20px rgba(255, 159, 10, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 159, 10, 0); }
    }

    .circle-container.running::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      animation: pulse-ring 2s ease-out infinite;
      pointer-events: none;
    }

    /* ── Beep flash ── */
    @keyframes beep-flash {
      0%   { opacity: 1; }
      40%  { opacity: 0.15; }
      100% { opacity: 1; }
    }
    .beep-flash { animation: beep-flash 0.22s ease-in-out; }
  </style>
</head>
<body>

<div class="timer-wrapper">

  <!-- Top stats -->
  <div class="stats-bar">
    <div class="stat-round">Round <span id="roundNum">1</span></div>
    <div class="stat-time" id="totalTime">0:00</div>
  </div>

  <div class="spacer"></div>

  <div class="circle-container" id="circleContainer">
    <svg class="ring" viewBox="0 0 320 320">
      <circle class="ring-track"    cx="160" cy="160" r="144" />
      <circle class="ring-progress" cx="160" cy="160" r="144" id="ringProgress" />
    </svg>
    <div class="center-display">
      <div class="time-text" id="timeDisplay">1:00</div>
      <div class="time-label"  id="timeLabel">tap to start</div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="controls">
    <div class="duration-picker">
      <button class="duration-btn active" data-sec="60">60s</button>
      <button class="duration-btn"        data-sec="90">90s</button>
      <button class="duration-btn"        data-sec="120">2:00</button>
    </div>
    <div class="action-row">

      <!-- Reset: arrow-counterclockwise icon (no emoji) -->
      <button class="btn-reset" id="btnReset" title="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>

      <!-- Start/Pause: pure SVG shapes, no emoji/unicode -->
      <button class="btn-start" id="btnStart">
        <!-- Play triangle -->
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6,3 20,12 6,21"/>
        </svg>
        <!-- Pause two bars -->
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5"  y="3" width="4" height="18" rx="1"/>
          <rect x="15" y="3" width="4" height="18" rx="1"/>
        </svg>
      </button>

    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let totalSeconds = 60;
  let remaining    = 60;
  let running      = false;
  let intervalId   = null;
  let finishing    = false;

  let round        = 1;
  let totalElapsed = 0;   // seconds accumulated across all rounds

  const R            = 144;
  const CIRCUMFERENCE = 2 * Math.PI * R;

  const ringProgress    = document.getElementById('ringProgress');
  const timeDisplay     = document.getElementById('timeDisplay');
  const timeLabel       = document.getElementById('timeLabel');
  const btnStart        = document.getElementById('btnStart');
  const btnReset        = document.getElementById('btnReset');
  const circleContainer = document.getElementById('circleContainer');
  const durationBtns    = document.querySelectorAll('.duration-btn');
  const roundNumEl      = document.getElementById('roundNum');
  const totalTimeEl     = document.getElementById('totalTime');

  function updateStatsBar() {
    roundNumEl.textContent = round;
    const m = Math.floor(totalElapsed / 60);
    const s = totalElapsed % 60;
    totalTimeEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
  }

  // ── Audio ──────────────────────────────────────────────────────────────────
  // iOS suspends AudioContext whenever there's no active audio graph.
  // A timer that runs for 60s will have a suspended context by the time it ends.
  // Fix: keep a silent looping buffer running the whole time the timer is active —
  // iOS never suspends a context with an active source node.

  let audioCtx      = null;
  let beepBuffer    = null;
  let silentSource  = null;   // looping silent node that keeps context alive

  function buildBeepBuffer(ctx) {
    const sr   = ctx.sampleRate;
    const spec = [
      { freq: 880,  start: 0.00, dur: 0.18, vol: 0.8 },
      { freq: 880,  start: 0.35, dur: 0.18, vol: 0.8 },
      { freq: 1320, start: 0.70, dur: 0.30, vol: 0.9 },
    ];
    const totalSamples = Math.ceil(1.3 * sr);
    const buf  = ctx.createBuffer(1, totalSamples, sr);
    const data = buf.getChannelData(0);

    for (const { freq, start, dur, vol } of spec) {
      const s0 = Math.floor(start * sr);
      const sN = Math.floor(dur   * sr);
      for (let i = 0; i < sN; i++) {
        const t   = i / sr;
        // smooth attack (5ms) and release (30ms)
        const att = Math.min(t / 0.005, 1);
        const rel = Math.min((dur - t) / 0.030, 1);
        data[s0 + i] += Math.sin(2 * Math.PI * freq * t) * vol * att * rel;
      }
    }
    return buf;
  }

  function buildSilentBuffer(ctx) {
    // 1-sample silent buffer — looped forever keeps context from suspending
    const buf  = ctx.createBuffer(1, 1, ctx.sampleRate);
    return buf;
  }

  function ensureAudio() {
    // Must be called from a user-gesture handler
    if (!audioCtx) {
      audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
      beepBuffer = buildBeepBuffer(audioCtx);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startKeepAlive() {
    if (!audioCtx || silentSource) return;
    silentSource        = audioCtx.createBufferSource();
    silentSource.buffer = buildSilentBuffer(audioCtx);
    silentSource.loop   = true;
    silentSource.connect(audioCtx.destination);
    silentSource.start();
  }

  function stopKeepAlive() {
    if (!silentSource) return;
    try { silentSource.stop(); } catch (_) {}
    silentSource.disconnect();
    silentSource = null;
  }

  function playFinishBeeps() {
    if (!audioCtx || !beepBuffer) return;
    const src = audioCtx.createBufferSource();
    src.buffer = beepBuffer;
    src.connect(audioCtx.destination);
    src.start();
  }

  function flashDisplay() {
    timeDisplay.classList.add('beep-flash');
    setTimeout(() => timeDisplay.classList.remove('beep-flash'), 240);
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s}`;
  }

  function setArcProgress(ratio) {
    ringProgress.style.strokeDasharray  = CIRCUMFERENCE;
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
  }

  function applyWarning(on) {
    ringProgress.classList.toggle('warning', on);
    timeDisplay.classList.toggle('warning', on);
  }

  function updateDisplay() {
    timeDisplay.textContent = formatTime(remaining);
    setArcProgress(remaining / totalSeconds);
    applyWarning(remaining <= Math.floor(totalSeconds * 0.3) && remaining > 0);
  }

  function setRunningUI(isRunning) {
    running = isRunning;
    btnStart.classList.toggle('running', isRunning);
    circleContainer.classList.toggle('running', isRunning);
    timeLabel.textContent = isRunning ? 'remaining' : (remaining === totalSeconds ? 'tap to start' : 'paused');
  }

  // ── Timer logic ────────────────────────────────────────────────────────────
  function tick() {
    if (remaining <= 0) return;
    remaining--;
    totalElapsed++;
    updateDisplay();
    updateStatsBar();

    if (remaining === 0) {
      clearInterval(intervalId);
      intervalId = null;
      finishing  = true;

      setRunningUI(false);
      applyWarning(false);
      timeLabel.textContent = 'done!';

      playFinishBeeps();
      [0, 300, 600].forEach(d => setTimeout(flashDisplay, d));

      setTimeout(() => {
        finishing  = false;
        round++;                        // next round
        remaining  = totalSeconds;
        updateDisplay();
        updateStatsBar();
        setRunningUI(true);
        startKeepAlive();
        requestWakeLock();
        intervalId = setInterval(tick, 1000);
      }, 1400);
    }
  }

  function startTimer() {
    if (remaining === 0) {
      remaining = totalSeconds;
      updateDisplay();
    }
    setRunningUI(true);
    startKeepAlive();
    requestWakeLock();
    intervalId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    clearInterval(intervalId);
    intervalId = null;
    stopKeepAlive();
    releaseWakeLock();
    setRunningUI(false);
  }

  function resetTimer() {
    clearInterval(intervalId);
    intervalId = null;
    stopKeepAlive();
    releaseWakeLock();
    finishing    = false;
    remaining    = totalSeconds;
    running      = false;
    round        = 1;
    totalElapsed = 0;
    applyWarning(false);
    updateDisplay();
    updateStatsBar();
    timeLabel.textContent = 'tap to start';
    btnStart.classList.remove('running');
    circleContainer.classList.remove('running');
  }

  // ── Wake Lock ──────────────────────────────────────────────────────────────
  // Prevents the phone screen from going dark while the timer is running.
  let wakeLock = null;

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      // Re-acquire if the page becomes visible again (e.g. user switches back)
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible' && running) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
        }
      });
    } catch (_) {}
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  // ── Events ─────────────────────────────────────────────────────────────────
  btnStart.addEventListener('click', () => {
    if (finishing) return;
    ensureAudio();   // unlock + pre-render buffer on first tap, re-resume if suspended
    if (running) {
      pauseTimer();
    } else {
      startTimer();
    }
  });

  btnReset.addEventListener('click', () => {
    ensureAudio();
    resetTimer();
  });

  durationBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      ensureAudio();
      if (running) pauseTimer();
      finishing    = false;
      round        = 1;
      totalElapsed = 0;
      durationBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      totalSeconds = parseInt(btn.dataset.sec, 10);
      remaining    = totalSeconds;
      updateDisplay();
      updateStatsBar();
      timeLabel.textContent = 'tap to start';
    });
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  setArcProgress(1);
  updateDisplay();
  updateStatsBar();
</script>
</body>
</html>
